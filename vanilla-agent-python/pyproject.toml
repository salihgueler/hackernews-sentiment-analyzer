[project]
name = "hackernews-sentiment-analyzer"
version = "0.1.0"
description = "An AI agent that monitors HackerNews, reads comments, and produces a sentiment report."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "tenacity>=8.2.3",
]

[project.scripts]
hn-sentiment = "hn_sentiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_sentiment"]
